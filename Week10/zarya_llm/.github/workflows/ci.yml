name: Zarya Banking AI - Continuous Integration Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test_and_benchmark:
    name: Unit Tests & Guardrail Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install fastapi uvicorn httpx pytest

      - name: Run Guardrails Pipeline Suite
        run: |
          python src/guardrails.py

      - name: Run Core Banking Ticketing Suite
        run: |
          python src/ticketing.py

      - name: Run Hybrid RAG & Policy Benchmark
        run: |
          python src/hybrid_rag.py

      - name: Run API Load Test & Serving Benchmark
        run: |
          python src/load_test.py

  docker_build_check:
    name: Verify Docker Container Build
    runs-on: ubuntu-latest
    needs: test_and_benchmark

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Build Docker Image
        run: |
          docker build -t zarya-bank-ai:ci-test .

