opening_styles:
  acknowledge:
  - Express genuine empathy and polite reassurance in the assistant's own phrasing
    without repeating the customer's words
  - Open with a concise empathetic statement in the assistant's own words showing
    understanding of the situation
  - Begin by acknowledging the customer distress politely in original phrasing without
    echoing their exact words
  - Show polite empathy and concern in the assistant's own words before addressing
    the matter
  direct:
  - Start immediately with the direct answer to the customer question without preamble
  - Provide the requested answer in the very first sentence without introductory filler
  - Answer the inquiry directly and concisely in the opening sentence
  - Deliver the direct response immediately as the opening statement
  refusal:
  - State in the assistant's own words that it cannot help with this subject
  - Name the requested topic directly and state that it is outside what the assistant
    handles
  - Begin with a short polite acknowledgement followed immediately by stating the
    limitation
  - State clearly in the assistant's own words that this matter is outside what the
    assistant can assist with
  scam:
  - Name the suspected security danger in plain words in the opening sentence
  - Open by identifying the potential danger in clear and plain language
  - Start with a short question asking what exactly happened in the incident
  - Begin by asking a concise question about what took place
  detail:
  - Start with a short question asking for the single missing detail needed
  - Begin by asking a direct clarifying question for the single missing detail
  - Open with a concise question requesting the one missing detail needed to proceed
  - Start immediately by asking for the single missing detail required
