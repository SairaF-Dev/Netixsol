    answer: 0
    misconceptions:
      1: the outer loop controls the columns and the inner loop the rows
      2: the two loop counts add up instead of multiplying

  - id: nested_loops-02
    type: code
    concepts: [nested_loops, lists]
    difficulty: 4
    bloom: create
    stem: Write multiplication_table(n) that returns a list of n rows; row i (starting at 1) is [i*1, i*2, ..., i*n]. multiplication_table(2) returns [[1, 2], [2, 4]].
    function: multiplication_table
    solution: |
      def multiplication_table(n):
          table = []
          for i in range(1, n + 1):
              row = []
              for j in range(1, n + 1):
                  row.append(i * j)
              table.append(row)
          return table
    buggy: |
      def multiplication_table(n):
          table = []
          for i in range(n):
              row = []
              for j in range(n):
                  row.append(i * j)
              table.append(row)
          return table
    tests:
      - {call: "multiplication_table(2)", expect: "[[1, 2], [2, 4]]"}
      - {call: "multiplication_table(3)", expect: "[[1, 2, 3], [2, 4, 6], [3, 6, 9]]", hidden: true}
      - {call: "multiplication_table(1)", expect: "[[1]]", hidden: true}

