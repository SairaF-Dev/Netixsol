  - id: nested_data-02
    type: code
    concepts: [nested_data, iterating_lists]
    difficulty: 3
    bloom: apply
    stem: students is a list of dictionaries with keys "name" and "house". Write names_in_house(students, house) that returns the list of names in that house, in order.
    function: names_in_house
    solution: |
      def names_in_house(students, house):
          names = []
          for s in students:
              if s["house"] == house:
                  names.append(s["name"])
          return names
    buggy: |
      def names_in_house(students, house):
          names = []
          for s in students:
              if s["house"] == house:
                  names.append(s)
          return names
    tests:
      - {call: 'names_in_house([{"name": "Harry", "house": "Gryffindor"}, {"name": "Draco", "house": "Slytherin"}], "Gryffindor")', expect: "['Harry']"}
      - {call: 'names_in_house([], "Gryffindor")', expect: "[]", hidden: true}
      - {call: 'names_in_house([{"name": "Ron", "house": "Gryffindor"}, {"name": "Ginny", "house": "Gryffindor"}], "Gryffindor")', expect: "['Ron', 'Ginny']", hidden: true}

