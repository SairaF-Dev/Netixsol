  # ---------------- for_loops ----------------
  - id: for_loops-01
    type: code
    concepts: [for_loops, range_function]
    difficulty: 2
    bloom: apply
    stem: Write sum_to(n) that returns 1 + 2 + ... + n using a for loop. sum_to(0) is 0.
    function: sum_to
    solution: |
      def sum_to(n):
          total = 0
          for i in range(1, n + 1):
              total += i
          return total
    buggy: |
      def sum_to(n):
          total = 0
          for i in range(n):
              total += i
          return total
    tests:
      - {call: "sum_to(3)", expect: "6"}
      - {call: "sum_to(1)", expect: "1", hidden: true}
      - {call: "sum_to(100)", expect: "5050", hidden: true}
      - {call: "sum_to(0)", expect: "0", hidden: true}

