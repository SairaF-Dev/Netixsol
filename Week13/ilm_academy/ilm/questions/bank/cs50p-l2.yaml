# CS50P Lecture 2: loops, lists, dictionaries.

questions:
  # ---------------- while_loops ----------------
  - id: while_loops-01
    type: mcq
    concepts: [while_loops]
    difficulty: 2
    bloom: understand
    stem: What does this program print?
    code: |
      i = 3
      while i > 0:
          print(i)
          i -= 1
    check_output: true
    options: ["3\n2\n1", "3\n2\n1\n0", "2\n1\n0"]
    answer: 0
    misconceptions:
      1: the loop runs once more after the condition becomes false
      2: the variable changes before the first print

  - id: while_loops-02
    type: mcq
    concepts: [while_loops]
    difficulty: 2
    bloom: analyze
    stem: This loop never stops. Why?
    code: |
      i = 0
      while i < 3:
          print(i)
    options:
      - i never changes, so i < 3 stays True forever
      - while loops always run forever unless you use break
      - print stops the loop from updating i
      - i < 3 should be i <= 3
    answer: 0
    misconceptions:
      1: a while loop can only end with break
      2: the loop updates the variable by itself
      3: the problem is the comparison, not the missing update

  - id: while_loops-03
    type: code
    concepts: [while_loops, integers]
    difficulty: 3
    bloom: apply
    stem: Write count_digits(n) for a whole number n >= 1 that returns how many digits it has, using a while loop and // 10 (no str()).
    function: count_digits
    solution: |
      def count_digits(n):
          count = 0
          while n > 0:
              n //= 10
              count += 1
          return count
    buggy: |
      def count_digits(n):
          count = 0
          while n > 9:
              n //= 10
              count += 1
          return count
    tests:
      - {call: "count_digits(12345)", expect: "5"}
      - {call: "count_digits(5)", expect: "1", hidden: true}
      - {call: "count_digits(100)", expect: "3", hidden: true}

  - id: while_loops-04
    type: code
    concepts: [while_loops, modulo, elif_else]
    difficulty: 4
    bloom: create
    stem: The Collatz rule turns n into n // 2 if n is even, or 3 * n + 1 if it is odd. Write collatz_steps(n) that returns how many steps it takes to reach 1.
    function: collatz_steps
    solution: |
      def collatz_steps(n):
          steps = 0
          while n != 1:
              if n % 2 == 0:
                  n = n // 2
              else:
                  n = 3 * n + 1
              steps += 1
          return steps
    buggy: |
      def collatz_steps(n):
          steps = 1
          while n != 1:
              if n % 2 == 0:
                  n = n // 2
              else:
                  n = 3 * n + 1
              steps += 1
          return steps
    tests:
      - {call: "collatz_steps(6)", expect: "8"}
      - {call: "collatz_steps(1)", expect: "0", hidden: true}
      - {call: "collatz_steps(27)", expect: "111", hidden: true}

