    code: |
      d = {"a": 1}
      print(d["b"])
    check_output: true
    options: ["KeyError", "None", "0"]
    answer: 0
    misconceptions:
      1: a missing key gives None (that is what d.get does)
      2: a missing key gives 0

  - id: dictionaries-03
    type: code
    concepts: [dictionaries, for_loops]
    difficulty: 3
    bloom: apply
    stem: 'Write count_letters(word) that returns a dictionary mapping each letter to how many times it appears. count_letters("aab") returns {"a": 2, "b": 1}.'
    function: count_letters
    solution: |
      def count_letters(word):
          counts = {}
          for ch in word:
              counts[ch] = counts.get(ch, 0) + 1
          return counts
    buggy: |
      def count_letters(word):
          counts = {}
          for ch in word:
              counts[ch] = 1
          return counts
    tests:
      - {call: 'count_letters("aab")', expect: "{'a': 2, 'b': 1}"}
      - {call: 'count_letters("")', expect: "{}", hidden: true}
      - {call: 'count_letters("hello")', expect: "{'h': 1, 'e': 1, 'l': 2, 'o': 1}", hidden: true}

  - id: dictionaries-04
    type: mcq
    concepts: [dictionaries]
    difficulty: 2
    bloom: understand
    stem: What does this program print?
    code: |
      d = {"a": 1}
      d["a"] = 5
      d["b"] = 2
      print(d)
    check_output: true
    options: ["{'a': 5, 'b': 2}", "{'a': 1, 'a': 5, 'b': 2}", "{'a': 1, 'b': 2}"]
    answer: 0
    misconceptions:
      1: assigning to an existing key adds a second entry with the same key
      2: the value of an existing key cannot be changed

