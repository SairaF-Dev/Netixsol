    concepts: [iterating_lists]
    difficulty: 2
    bloom: apply
    stem: Write count_long(words, n) that returns how many words have MORE than n letters.
    function: count_long
    solution: |
      def count_long(words, n):
          count = 0
          for w in words:
              if len(w) > n:
                  count += 1
          return count
