  # ---------------- dictionaries ----------------
  - id: dictionaries-01
    type: mcq
    concepts: [dictionaries]
    difficulty: 1
    bloom: understand
    stem: What does this program print?
    code: |
      houses = {"Harry": "Gryffindor", "Draco": "Slytherin"}
      print(houses["Draco"])
    check_output: true
    options: ["Slytherin", "Draco", "KeyError"]
    answer: 0
    misconceptions:
      1: looking up a key gives back the key itself
      2: dictionaries are looked up by position, not by key

  - id: dictionaries-02
    type: mcq
    concepts: [dictionaries]
    difficulty: 2
