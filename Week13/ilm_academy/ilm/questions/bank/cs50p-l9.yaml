  - id: generators-03
    type: code
    concepts: [generators]
    difficulty: 4
    bloom: apply
    stem: Write a generator evens_up_to(n) that yields the even numbers from 0 to n inclusive (use yield, do not build a list).
    function: evens_up_to
    solution: |
      def evens_up_to(n):
          for i in range(0, n + 1, 2):
              yield i
    buggy: |
      def evens_up_to(n):
          return [i for i in range(0, n + 1, 2)]
    tests:
      - {call: "list(evens_up_to(6))", expect: "[0, 2, 4, 6]"}
      - {call: "list(evens_up_to(0))", expect: "[0]", hidden: true}
      - {call: "type(evens_up_to(4)).__name__", expect: "'generator'", hidden: true}
