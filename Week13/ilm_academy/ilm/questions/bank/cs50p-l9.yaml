# CS50P Lecture 9: et cetera.

questions:
  # ---------------- sets ----------------
  - id: sets-01
    type: mcq
    concepts: [sets]
    difficulty: 1
    bloom: understand
    stem: What does this program print?
    code: print(len({"a", "b", "a", "c", "b"}))
    check_output: true
    options: ["3", "5", "2"]
    answer: 0
    misconceptions:
      1: a set keeps duplicate items
      2: a set drops every item that appears more than once

  - id: sets-02
    type: code
    concepts: [sets, nested_data]
    difficulty: 2
    bloom: apply
    stem: students is a list of dicts with a "house" key. Write unique_houses(students) that returns each house once, as a list sorted alphabetically.
    function: unique_houses
    solution: |
      def unique_houses(students):
          return sorted({s["house"] for s in students})
    buggy: |
      def unique_houses(students):
          return sorted(s["house"] for s in students)
    tests:
      - {call: 'unique_houses([{"house": "Slytherin"}, {"house": "Gryffindor"}, {"house": "Gryffindor"}])', expect: "['Gryffindor', 'Slytherin']"}
      - {call: "unique_houses([])", expect: "[]", hidden: true}
      - {call: 'unique_houses([{"house": "Ravenclaw"}, {"house": "Ravenclaw"}])', expect: "['Ravenclaw']", hidden: true}

  - id: sets-03
    type: mcq
    concepts: [sets, lists]
    difficulty: 4
    bloom: evaluate
    stem: A program checks "if name in names" thousands of times against one million names. Should names be a list or a set?
    options:
      - A set, because checking membership takes about the same time however big it is
      - A list, because lists are always faster
      - It makes no difference
      - A list, because sets cannot hold strings
    answer: 0
    misconceptions:
      1: lists are always the faster container
      2: all containers search at the same speed
      3: sets can only hold numbers

  # ---------------- constants_globals ----------------
  - id: constants_globals-01
    type: mcq
    concepts: [constants_globals, scope]
    difficulty: 3
    bloom: understand
    stem: What does this program print?
    code: |
      balance = 0
      def deposit(n):
          global balance
          balance += n
      deposit(10)
      deposit(5)
      print(balance)
    check_output: true
    options: ["15", "0", "UnboundLocalError"]
    answer: 0
    misconceptions:
      1: a function can never change a variable outside it
      2: global does not change how the name is looked up

  - id: constants_globals-02
    type: mcq
    concepts: [constants_globals]
    difficulty: 2
    bloom: remember
    stem: What does writing a name in capitals, like MEOWS = 3, tell other programmers?
    options:
      - It is meant to be a constant that should not change; Python does not enforce this
      - Python raises an error if anyone changes it
      - It is a global that functions may change freely
      - Capital names are required for numbers
    answer: 0
    misconceptions:
      1: Python enforces constants
      2: capitals mark a variable for changing
      3: capitals are a type rule

  - id: constants_globals-03
    type: short
    concepts: [constants_globals, parameters]
    difficulty: 4
    bloom: evaluate
    stem: Why do experienced programmers avoid global variables when they can, and what do they do instead?
    rubric:
      - Any function can change a global, so bugs are hard to trace and functions are hard to test alone
      - Pass values in as parameters and return results, or keep the state in an object

