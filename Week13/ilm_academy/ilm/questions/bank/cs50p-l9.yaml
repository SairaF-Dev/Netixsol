  # ---------------- docstrings ----------------
  - id: docstrings-01
    type: mcq
    concepts: [docstrings]
    difficulty: 3
    bloom: understand
    stem: What does this program print?
    code: |
      def meow(n):
          """Meow n times."""
          return "meow" * n
      print(meow.__doc__)
    check_output: true
    options: ["Meow n times.", "None", "meow"]
    answer: 0
    misconceptions:
      1: a docstring is thrown away like a comment
      2: __doc__ holds the function's name

  - id: docstrings-02
    type: mcq
    concepts: [docstrings]
    difficulty: 2
    bloom: remember
    stem: Where must a docstring go to document a function?
    options:
      - As the first statement inside the function body
      - In a comment above the def line
      - At the end of the function
      - In a separate text file
    answer: 0
    misconceptions:
      1: a comment above the function is its docstring
      2: any string inside the function counts
      3: documentation lives outside the code

  - id: docstrings-03
    type: short
    concepts: [docstrings, comments]
    difficulty: 3
    bloom: understand
    stem: What is the difference between a comment and a docstring?
    rubric:
      - A comment (#) is ignored by Python and explains the code to people reading the source
      - A docstring is a string Python keeps as __doc__; help() and documentation tools show it
      - Docstrings describe what a function or module does and how to use it

  # ---------------- argparse_module ----------------
  - id: argparse_module-01
    type: mcq
    concepts: [argparse_module]
    difficulty: 3
    bloom: apply
    stem: What does this program print?
    code: |
      import argparse
      parser = argparse.ArgumentParser()
      parser.add_argument("-n", type=int, default=1)
      args = parser.parse_args(["-n", "3"])
      print(args.n * 2)
    check_output: true
    options: ["6", "33", "2"]
    answer: 0
    misconceptions:
      1: argparse values are always strings, even with type=int
      2: the default is used even when a value is given

  - id: argparse_module-02
    type: mcq
    concepts: [argparse_module, command_line_args]
    difficulty: 2
    bloom: understand
    stem: What does argparse give you for free, compared with reading sys.argv yourself?
    options:
      - A --help message, error messages for bad input, and type conversion
      - A faster program start-up
      - Access to arguments that sys.argv cannot see
      - The ability to run without a terminal
    answer: 0
    misconceptions:
      1: argparse is about speed
      2: argparse reads arguments from somewhere other than sys.argv
      3: argparse removes the need for a terminal

  - id: argparse_module-03
    type: code
    concepts: [argparse_module]
    difficulty: 3
    bloom: apply
    stem: Write parse(argv) that uses argparse with an option -n (an int, default 1), parses the list argv, and returns n.
    function: parse
    solution: |
      import argparse
      def parse(argv):
          parser = argparse.ArgumentParser()
          parser.add_argument("-n", type=int, default=1)
          return parser.parse_args(argv).n
    buggy: |
      import argparse
      def parse(argv):
          parser = argparse.ArgumentParser()
          parser.add_argument("-n", default=1)
          return parser.parse_args(argv).n
    tests:
      - {call: 'parse(["-n", "3"])', expect: "3"}
      - {call: "parse([])", expect: "1", hidden: true}
      - {call: 'parse(["-n", "10"])', expect: "10", hidden: true}

  # ---------------- tuples_unpacking ----------------
