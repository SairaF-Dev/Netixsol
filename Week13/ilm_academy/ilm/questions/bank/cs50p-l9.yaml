  - id: dict_comprehensions-02
    type: code
    concepts: [dict_comprehensions]
    difficulty: 3
    bloom: apply
    stem: 'Write invert(d) that returns a new dict with keys and values swapped. invert({"a": 1, "b": 2}) returns {1: "a", 2: "b"}.'
    function: invert
    solution: |
      def invert(d):
          return {v: k for k, v in d.items()}
    buggy: |
      def invert(d):
          return {k: v for k, v in d.items()}
    tests:
