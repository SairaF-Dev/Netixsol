  # ---------------- generators ----------------
  - id: generators-01
    type: mcq
    concepts: [generators]
    difficulty: 4
    bloom: understand
    stem: What does this program print?
    code: |
      def count_up(n):
          for i in range(n):
              yield i
      g = count_up(3)
      print(next(g), next(g))
    check_output: true
    options: ["0 1", "0 0", "[0, 1, 2]"]
    answer: 0
    misconceptions:
      1: each next() restarts the function from the top
      2: a function with yield returns the whole list

