  - id: enumerate_function-02
    type: code
    concepts: [enumerate_function, f_strings]
    difficulty: 2
    bloom: apply
    stem: 'Write numbered(items) that returns lines like "1. apple", numbering from 1. numbered(["apple", "fig"]) returns ["1. apple", "2. fig"].'
