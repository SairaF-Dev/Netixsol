  stem: Which of the following functions is a generator that correctly yields all numbers from 1 up to
    n inclusive, and why?
  type: mcq
  options:
  - "def f(n):\n    for i in range(1, n + 1):\n        return i"
  - "def f(n):\n    for i in range(1, n + 1):\n        yield i"
  - "def f(n):\n    L = []\n    for i in range(1, n + 1):\n        L.append(i)\n    yield L"
  - "def f(n):\n    yield range(1, n + 1)"
  answer: 1
  misconceptions:
    0: Using return inside a loop exits the function immediately on the first iteration instead of yielding
      multiple values over time.
    2: Appending everything to a list and yielding the list defeats the memory-saving purpose of a generator
      by building the entire collection at once.
    3: Yielding the range object itself yields a single range object instead of individual values computed
      lazily across iterations.
  check_output: false
