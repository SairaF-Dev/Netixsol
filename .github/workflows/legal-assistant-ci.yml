# CI for Week12/AI_Legal_Assistant: tests on every push / pull request that touches the project,
# then a Docker build and a smoke test of the built image.
name: AI Legal Assistant CI

on:
  push:
    paths:
      - "Week12/AI_Legal_Assistant/**"
      - ".github/workflows/legal-assistant-ci.yml"
  pull_request:
    paths:
      - "Week12/AI_Legal_Assistant/**"
      - ".github/workflows/legal-assistant-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: legal-assistant-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: Week12/AI_Legal_Assistant

jobs:
  tests:
    name: Tests (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Week12/AI_Legal_Assistant/requirements.txt

      - name: Cache the embedding and reranker models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-e5-small-mmarco-v1

      - name: Install (CPU-only PyTorch, then the project)
        run: |
          pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: "Run the tests (no Gemini, Neo4j or secrets needed: the LLM is faked)"
        run: python -m pytest -q -p no:warnings

  docker:
    name: Docker build and smoke test
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: docker compose config --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: Week12/AI_Legal_Assistant
          tags: legal-assistant:ci
          load: true
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test - the app starts and answers its liveness check
        run: |
          docker run -d --name app -p 8000:8000 -e HF_HUB_OFFLINE=1 legal-assistant:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health/live; then echo; break; fi
            sleep 3
          done
          curl -fsS http://127.0.0.1:8000/api/health/live | grep -q alive
          # without data the readiness check must say "down" (HTTP 503), not crash
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/health)" = "503"
          # every API needs a sign-in
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/meta)" = "401"

      - name: Container logs on failure
        if: failure()
        run: docker logs app || true
